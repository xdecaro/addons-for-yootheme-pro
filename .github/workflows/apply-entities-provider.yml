name: Apply Competitions Entity Provider

on:
  push:
    branches: [feature/competitions-dynamic-sources]
    paths:
      - tools/apply_entities_provider.py
      - .github/workflows/apply-entities-provider.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/competitions-dynamic-sources
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Apply provider helpers
        run: python3 tools/apply_entities_provider.py
      - name: Verify provider syntax and contract surface
        run: |
          php -l modules/competitions/src/CompetitionProvider.php
          grep -F "public static function federationOptions(): array" modules/competitions/src/CompetitionProvider.php
          grep -F "public static function competitionTeamOptions(): array" modules/competitions/src/CompetitionProvider.php
          grep -F "public static function competitionRosterPlayerOptions(): array" modules/competitions/src/CompetitionProvider.php
          grep -F "getParticipatingTeams" modules/competitions/src/CompetitionProvider.php
          grep -F "getRoster" modules/competitions/src/CompetitionProvider.php
      - name: Commit provider change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/competitions/src/CompetitionProvider.php
          git diff --cached --quiet || git commit -m "feat: add scoped competition entity selectors"
          git push origin HEAD:feature/competitions-dynamic-sources
