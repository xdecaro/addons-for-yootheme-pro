name: Competitions Dynamic Sources

on:
  pull_request:
  push:
    branches:
      - main
      - feature/competitions-dynamic-sources

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Contract syntax
        run: php -l tests/competitions-dynamic-sources-contract.php
      - name: Competitions dynamic sources contract
        run: php tests/competitions-dynamic-sources-contract.php
