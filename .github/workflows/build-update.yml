name: Build Joomla update package

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'update.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP and update feed
        shell: python
        run: |
          import hashlib
          import pathlib
          import textwrap
          import xml.etree.ElementTree as ET
          import zipfile

          root = pathlib.Path('.')
          manifest = root / 'loadmoreyootheme.xml'
          version = ET.parse(manifest).getroot().findtext('version').strip()
          package_name = f'plg_system_loadmoreyootheme_{version}.zip'
          dist = root / 'dist'
          dist.mkdir(exist_ok=True)
          package = dist / package_name

          include = [
              root / 'loadmoreyootheme.php',
              root / 'loadmoreyootheme.xml',
              root / 'README.md',
              root / 'vendor',
              root / 'modules',
          ]

          if package.exists():
              package.unlink()

          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as zf:
              for entry in include:
                  if entry.is_file():
                      zf.write(entry, entry.relative_to(root).as_posix())
                  else:
                      for file in sorted(entry.rglob('*')):
                          if file.is_file():
                              zf.write(file, file.relative_to(root).as_posix())

          sha256 = hashlib.sha256(package.read_bytes()).hexdigest()
          update_xml = f'''<?xml version="1.0" encoding="utf-8"?>
          <updates>
            <update>
              <name>Load More for YOOtheme Pro</name>
              <description>Load More and Infinite Scroll for YOOtheme Pro Builder with Joomla AJAX pagination.</description>
              <element>loadmoreyootheme</element>
              <type>plugin</type>
              <folder>system</folder>
              <client>site</client>
              <version>{version}</version>
              <infourl title="Load More for YOOtheme Pro">https://github.com/xdecaro/loader-more-yootheme</infourl>
              <downloads>
                <downloadurl type="full" format="zip">https://raw.githubusercontent.com/xdecaro/loader-more-yootheme/main/dist/{package_name}</downloadurl>
              </downloads>
              <tags><tag>stable</tag></tags>
              <sha256>{sha256}</sha256>
              <maintainer>Luca De Caro</maintainer>
              <maintainerurl>https://lucadecaro.it</maintainerurl>
              <targetplatform name="joomla" version="((4\\.[0-9]+)|(5\\.[0-9]+)|(6\\.[0-9]+))" />
              <php_minimum>8.0</php_minimum>
            </update>
          </updates>
          '''
          (root / 'update.xml').write_text(textwrap.dedent(update_xml).strip() + '\n', encoding='utf-8')
          print(f'Built {package} ({sha256})')

      - name: Commit generated update files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist update.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: publish Joomla update package"
            git push
          fi
