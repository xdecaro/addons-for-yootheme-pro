name: Competitions source contract

on:
  pull_request:
    paths:
      - 'modules/competitions/**'
      - 'tests/competitions-source-contract.php'
      - '.github/workflows/competitions-source.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Competitions source contract
        run: php tests/competitions-source-contract.php
