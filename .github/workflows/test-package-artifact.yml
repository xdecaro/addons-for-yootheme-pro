name: Test Package Artifact

on:
  push:
    branches:
      - feature/competitions-dynamic-sources

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate source
        run: python3 tools/build.py --check
      - name: Build installable package
        run: python3 tools/build.py
      - name: Verify ZIP integrity
        run: unzip -t build/plg_system_xdecaro_*.zip
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: yootheme-essential-addons-test
          path: |
            build/plg_system_xdecaro_*.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
